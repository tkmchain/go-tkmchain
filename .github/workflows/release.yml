name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            artifact: release-linux
            randomx_dir: build/_workspace/randomx-linux
          - runner: macos-latest
            platform: macos
            artifact: release-macos
            randomx_dir: build/_workspace/randomx-macos
          - runner: windows-latest
            platform: windows
            artifact: release-windows
            randomx_dir: build/_workspace/randomx-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Set up Windows build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            cmake
            zip
            mingw-w64-ucrt-x86_64-toolchain

      - name: Find Go for MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $goBin = Split-Path -Parent (Get-Command go).Source
          "GO_BIN=$goBin" >> $env:GITHUB_ENV

      - name: Build and package Linux or macOS binaries
        if: runner.os != 'Windows'
        env:
          RANDOMX_DIR: ${{ matrix.randomx_dir }}
        run: |
          make gtkm shielded-payout-prover
          archive="gtkm-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "release/$archive"
          cp build/bin/gtkm build/bin/shielded-payout-prover "release/$archive/"
          tar -C release -czf "release/$archive.tar.gz" "$archive"

      - name: Build and package Windows binaries
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          RANDOMX_DIR: ${{ matrix.randomx_dir }}
        run: |
          export PATH="$(cygpath -u "$GO_BIN"):$PATH"
          go version
          make gtkm shielded-payout-prover
          archive="gtkm-${GITHUB_REF_NAME}-windows"
          mkdir -p "release/$archive"
          cp build/bin/gtkm.exe build/bin/shielded-payout-prover.exe "release/$archive/"
          zip -r "release/$archive.zip" "$archive"

      - name: Upload platform archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
