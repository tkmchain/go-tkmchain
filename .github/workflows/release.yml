name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    name: Linux AMD64 release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake g++

      - name: Build production runtime
        env:
          GO_BUILD_P: "2"
          RANDOMX_ARCH: default
          VERSION: ${{ github.ref_name }}
        run: make production

      - name: Verify release version
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          ./build/bin/gtkm version | grep --fixed-strings "Version: ${release_version}"

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="tkmchain-${version}-linux-amd64"
          mkdir -p "dist/${package}"
          install -m 0755 build/bin/gtkm "dist/${package}/gtkm"
          install -m 0755 build/bin/shielded-payout-prover "dist/${package}/shielded-payout-prover"
          install -m 0644 README.md COPYING COPYING.LESSER "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          cd dist
          sha256sum "${package}.tar.gz" > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tkmchain-${{ github.ref_name }}-linux-amd64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "TKMChain ${GITHUB_REF_NAME}"
