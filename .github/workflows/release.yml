name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version label to package (publishing requires the existing tag)
        required: true
        type: string
      validation_only:
        description: Build and validate all packages without publishing a release
        required: true
        default: true
        type: boolean
      source_ref:
        description: Optional source ref for validation only (resolved once to an exact commit)
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
  GOFLAGS: "-buildvcs=false"

jobs:
  resolve-source:
    name: Resolve exact release validation source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate invocation
        env:
          SOURCE_OVERRIDE: ${{ inputs.source_ref }}
          VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_OVERRIDE" && "$VALIDATION_ONLY" != true ]]; then
            echo 'A source override is permitted only for nonpublishing validation.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo 'The release label must contain only letters, digits, dots, underscores, pluses and hyphens.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.source_ref || inputs.release_tag }}
          persist-credentials: false
      - name: Record exact source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  shield6-validation:
    name: Validate Shield6 consensus and TCP reorg before packaging
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GOMAXPROCS: '1'
      GOMEMLIMIT: 1300MiB
      GOGC: '20'
      CARGO_BUILD_JOBS: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install native proof toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          ./scripts/shield4-build.sh
      - name: Verify crypto, consensus, real pools, TCP sync and reorg
        run: go test -p=1 -tags shield3 ./zk/shielded6 ./core ./eth ./core/txpool/legacypool ./params -run 'Shield6|ShieldedV6|CLSAG|ConfidentialLedger|ActivationRemainsUnset' -count=1 -timeout=10m
      - name: Download authenticated production parameters
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_shield6*.py'
          python3 scripts/shield6-release-parameters.py --output "$RUNNER_TEMP/shield6-production-parameters"
      - name: Verify the recipient-binding constrained relation
        env:
          GOMEMLIMIT: 4GiB
          GOMAXPROCS: '2'
        run: go test -short -p=1 -tags shield3 ./zk/shielded6/recipient -count=1 -timeout=15m
      - name: Verify proof-bearing recipient consensus integration
        env:
          GOMEMLIMIT: 4GiB
          GOMAXPROCS: '2'
          SHIELD6_RECIPIENT_INTEGRATION: '1'
          SHIELD6_RECIPIENT_PRODUCTION_PARAMETERS: ${{ runner.temp }}/shield6-production-parameters
          SHIELD6_RECIPIENT_NETWORK_FIXTURE: ${{ runner.temp }}/shield6-recipient-network.json
        run: go test -p=1 -tags shield3 ./core -run '^TestShield6RecipientEndToEnd$' -count=1 -timeout=90m -v
      - name: Verify real recipient proofs through TCP propagation and reorgs
        env:
          SHIELD6_RECIPIENT_NETWORK_FIXTURE: ${{ runner.temp }}/shield6-recipient-network.json
        run: go test -p=1 -tags shield3 ./eth -run '^TestShield6RecipientTCPSpendAndReorg$' -count=1 -timeout=10m -v
      - name: Verify wallet and CLI integration
        run: go test -p=1 -tags shield3 ./internal/shield3wallet ./cmd/gtkm ./cmd/shielded-ceremony -run 'ShieldedV6|Shield6|GenerateLocal' -skip 'MigrationNativeRehearsal' -count=1 -timeout=10m
      - name: Verify native legacy migration separately
        run: go test -p=1 -tags shield3 ./internal/shield3wallet -run '^TestShield6MigrationNativeRehearsal$' -count=1 -timeout=15m
      - name: Race-test Shield6 wallet construction and scanning
        run: go test -race -p=1 -tags shield3 ./internal/shield3wallet -run 'ShieldedV6|Shield6' -skip 'MigrationNativeRehearsal' -count=1 -timeout=10m

  build:
    needs: [resolve-source, shield6-validation]
    name: Build ${{ matrix.platform }} binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the arm64 artifact with Apple's cross-target toolchain on
          # Intel macOS. Standard Apple Silicon runners are capacity-limited.
          - runner: macos-26-intel
            platform: macos
            artifact: release-macos
          - runner: windows-latest
            platform: windows
            artifact: release-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          check-latest: true

      - name: Test Shield6 cryptography on release host
        run: go test -tags shield3 ./zk/shielded6 -count=1

      - name: Install Shield3 Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          if [[ "$RUNNER_OS" == Windows ]]; then
            rustup target add x86_64-pc-windows-gnu
          elif [[ "$RUNNER_OS" == macOS ]]; then
            rustup target add aarch64-apple-darwin
          fi

      - name: Set up Windows build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            cmake
            zip
            mingw-w64-ucrt-x86_64-toolchain

      - name: Find Go for MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $goBin = Split-Path -Parent (Get-Command go).Source
          "GO_BIN=$goBin" >> $env:GITHUB_ENV

      - name: Build and package Linux or macOS binaries
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            VERSION="$RELEASE_TAG" RANDOMX_ARCH=default ./scripts/build-macos-arm64.sh
          else
            ./scripts/shield4-build.sh
            VERSION="$RELEASE_TAG" RANDOMX_ARCH=default make gtkm tkm-email shielded-payout-prover
          fi
          archive="gtkm-${RELEASE_TAG}-${{ matrix.platform }}"
          mkdir -p "release/$archive"
          cp build/bin/gtkm build/bin/tkm-email build/bin/shielded-payout-prover "release/$archive/"
          cp THIRD_PARTY_NOTICES "release/$archive/"
          tar -C release -czf "release/$archive.tar.gz" "$archive"

      - name: Build and package Windows binaries
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath -u "$GO_BIN"):$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          export CC=gcc CXX=g++
          go version
          SHIELD4_RUST_TARGET=x86_64-pc-windows-gnu ./scripts/shield4-build.sh

          # RandomX is C++, so the ordinary host link flags would leave gtkm.exe
          # dependent on MSYS2's libstdc++-6.dll (and usually libwinpthread).
          # Link those MinGW runtimes statically so the release is portable to a
          # clean Windows installation.
          windows_randomx_ldflags="-Lbuild/_workspace/randomx/build-host -lrandomx -static-libgcc -static-libstdc++ -Wl,-Bstatic -lstdc++ -lwinpthread -Wl,-Bdynamic -lm"
          VERSION="$RELEASE_TAG" RANDOMX_ARCH=default make HOST_RANDOMX_LDFLAGS="$windows_randomx_ldflags" gtkm
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.Version=$RELEASE_TAG" -o build/bin/tkm-email.exe ./cmd/tkm-email
          VERSION="$RELEASE_TAG" RANDOMX_ARCH=default CGO_LDFLAGS="-static-libgcc -Wl,-Bstatic -lwinpthread -Wl,-Bdynamic" make shielded-payout-prover

          archive="gtkm-${RELEASE_TAG}-windows"
          mkdir -p "release/$archive"
          cp build/bin/gtkm "release/$archive/gtkm.exe"
          cp build/bin/tkm-email.exe "release/$archive/tkm-email.exe"
          cp build/bin/shielded-payout-prover "release/$archive/shielded-payout-prover.exe"
          cp THIRD_PARTY_NOTICES "release/$archive/"

          # Do not publish executables that only work inside the MSYS2 runner.
          for binary in "release/$archive/gtkm.exe" "release/$archive/shielded-payout-prover.exe"; do
            runtime_dlls="$(objdump -p "$binary" | sed -n 's/^[[:space:]]*DLL Name: //p')"
            echo "Imported DLLs for $binary:"
            printf '%s\n' "$runtime_dlls"
            if printf '%s\n' "$runtime_dlls" | grep -Eiq '^(libstdc\+\+-6|libgcc_s_[^.]+-1|libwinpthread-1)\.dll$'; then
              echo "ERROR: $binary still depends on a MinGW runtime DLL" >&2
              exit 1
            fi
          done

          (cd release && zip -r "$archive.zip" "$archive")

      - name: Upload platform archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error
          retention-days: 1

  build-debian13:
    needs: [resolve-source, shield6-validation]
    name: Build portable Linux binaries
    runs-on: ubuntu-latest
    container:
      # Debian 11 provides glibc 2.31, keeping the Linux archive usable on
      # older Ubuntu/Debian hosts as well as newer distributions.
      image: debian:11-slim

    steps:
      - name: Install Linux build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Debian 11 is archived; use the archive mirror so package indexes
          # and security packages remain available after mirror rotation.
          sed -i \
            -e 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            /etc/apt/sources.list
          # Bullseye security was retired from the archive; leaving that
          # suite enabled causes a fatal missing-Release error.
          sed -i -e '/debian-security/d' -e '/bullseye-updates/d' /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*.sources
          rm -rf /var/lib/apt/lists/*
          printf '%s\n' 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          apt-get -o Acquire::Check-Valid-Until=false update
          # The slim image can contain newer point releases than the archived
          # Bullseye index. Align the ABI packages before installing tools.
          apt-get install -y --allow-downgrades \
            libc6=2.31-13+deb11u11 \
            libc6-dev=2.31-13+deb11u11 \
            libc-bin=2.31-13+deb11u11 \
            perl-base=5.32.1-4+deb11u3 \
            perl=5.32.1-4+deb11u3
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            gzip \
            pkg-config \
            tar \
            zip
          rm -rf /var/lib/apt/lists/*

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory /__w/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          check-latest: true

      - name: Install Shield3 Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/tkm-rustup.sh
          sh /tmp/tkm-rustup.sh -y --profile minimal --default-toolchain 1.89.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify environment
        run: |
          cat /etc/os-release
          git --version
          go version
          go env

      - name: Build and package portable Linux binaries
        run: |
          ./scripts/shield4-build.sh
          # Exercise the Shield6 crypto, consensus, wallet, and migration
          # gates on the exact source revision used for this release.
          go test -tags shield3 ./zk/shielded6 -count=1
          go test ./params -run '^TestShield6ActivationRemainsUnsetOnShippedNetworks$' -count=1
          go test -tags shield3 ./core ./eth -run 'ShieldedV6|Shield6|CLSAG' -count=1
          GOMAXPROCS=1 GOMEMLIMIT=1300MiB GOGC=20 go test -p=1 -tags shield3 ./core -run '^TestShield6TwoNodeDepositSpendReplayAndReorgRehearsal$' -count=1 -timeout=10m -v
          go test -tags shield3 ./internal/shield3wallet -run '^(TestBuildAndSignShieldedV6Payment|TestBuildAndSignShieldedV6Deposit|TestBuildAndSignShieldedV6Withdrawal|TestSelectShieldedV6RingUsesCanonicalCandidates|TestScanShieldedV6FindsSpendableNoteAndDetectsReorg|TestClearShieldedV6SpendCandidatesZeroizesPageNotes|TestScanShieldedV6MatchesPublicSpentKeyImagesLocally)$' -count=1
          # Record maximum proof verification and wallet envelope construction
          # cost on the same Linux release runner used for the daemon artifact.
          GOMAXPROCS=1 GOMEMLIMIT=1300MiB GOGC=20 go test -p=1 -tags shield3 ./zk/shielded6 -run '^$' -bench 'BenchmarkShield6Max(OutputRangeProof128|OutputRangeProofVerify|InputCLSAGVerify)$' -benchtime=1x -count=1
          GOMAXPROCS=1 GOMEMLIMIT=1300MiB GOGC=20 go test -p=1 -tags shield3 ./core -run '^$' -bench '^BenchmarkShield6MaxPaymentEnvelope$' -benchtime=1x -count=1
          # Keep the full legacy-proof-to-Shield6 migration rehearsal visible
          # as its own release gate. It exercises native proof generation and
          # can use several GiB, so do not hide or duplicate it in a broad
          # regex-based test command.
          GOMAXPROCS=1 GOMEMLIMIT=1300MiB GOGC=20 go test -p=1 -tags shield3 ./internal/shield3wallet -run '^TestShield6MigrationNativeRehearsal$' -count=1 -timeout=30m -v
          go test -tags shield3 ./cmd/gtkm -run 'TestShield6Migration(FeeReserve|DepositBalanceRequired)|TestWaitWalletCanonicalConfirmations' -count=1
          go test ./eth ./cmd/gtkm -run 'TestTkmNameAPI|TestUsernameRPCIncludedInDefaultHTTPAndWSModules|TestUsernameFlagEnablesTKMNetWithoutForkGate' -count=1
          VERSION="$RELEASE_TAG" RANDOMX_ARCH=default make gtkm tkm-email shielded-payout-prover
          stack_flags="$(readelf -W -l build/bin/gtkm | awk '$1 == "GNU_STACK" { print $7; found=1 } END { if (!found) exit 1 }')"
          test "$stack_flags" = RW
          archive="gtkm-${RELEASE_TAG}-linux-amd64"
          mkdir -p "release/$archive"
          cp build/bin/gtkm build/bin/tkm-email build/bin/shielded-payout-prover "release/$archive/"
          cp THIRD_PARTY_NOTICES "release/$archive/"
          tar -C release -czf "release/$archive.tar.gz" "$archive"
          ./packaging/build-deb.sh "$RELEASE_TAG" release amd64

      - name: Upload portable Linux archive and Debian package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.tar.gz
            release/*.deb
          if-no-files-found: error
          retention-days: 1

  build-linux-arm:
    needs: [resolve-source, shield6-validation]
    name: Build Linux ${{ matrix.label }} binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            make_cc: AARCH64_CC
            make_cxx: AARCH64_CXX
            cross_target: cross-linux-arm64
            output_dir: arm64
            binary_suffix: arm64
            rust_target: aarch64-unknown-linux-gnu
            deb_arch: arm64
          - label: armv7
            goarch: arm
            goarm: 7
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
            make_cc: ARM_CC
            make_cxx: ARM_CXX
            cross_target: cross-linux-arm
            output_dir: arm
            binary_suffix: arm
            rust_target: armv7-unknown-linux-gnueabihf
            deb_arch: armhf

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          check-latest: true

      - name: Install Linux cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

      - name: Install Shield3 Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustup target add '${{ matrix.rust_target }}'

      - name: Build Linux ${{ matrix.label }} binaries
        env:
          ARM_CC: ${{ matrix.cc }}
          ARM_CXX: ${{ matrix.cxx }}
          ARM_GOARCH: ${{ matrix.goarch }}
          ARM_GOARM: ${{ matrix.goarm }}
          ARM_LABEL: ${{ matrix.label }}
          ARM_OUTPUT_DIR: ${{ matrix.output_dir }}
          ARM_BINARY_SUFFIX: ${{ matrix.binary_suffix }}
          ARM_CROSS_TARGET: ${{ matrix.cross_target }}
          ARM_MAKE_CC: ${{ matrix.make_cc }}
          ARM_MAKE_CXX: ${{ matrix.make_cxx }}
          ARM_RUST_TARGET: ${{ matrix.rust_target }}
          ARM_DEB_ARCH: ${{ matrix.deb_arch }}
          # The pinned Triton proof dependency has a high-memory optimized
          # compile. Serialize Cargo jobs so ARM release builds fit hosted
          # runner memory without changing the release optimization profile.
          CARGO_BUILD_JOBS: "1"
        run: |
          set -euo pipefail
          # The RingCT backend is pure Go, but the crypto dependency graph and
          # test vectors must still compile for every published Linux target.
          GOOS=linux GOARCH="$ARM_GOARCH" GOARM="${ARM_GOARM:-}" \
            go test -tags shield3 -c -o "/tmp/shield6-${ARM_LABEL}.test" ./zk/shielded6
          # Build the architecture-specific Rust static library explicitly. The
          # Go cgo package links this exact path, so fail here with a useful
          # diagnostic instead of waiting for clang to report a missing file.
          CC="$ARM_CC" SHIELD4_RUST_TARGET="$ARM_RUST_TARGET" ./scripts/shield4-build.sh
          native_lib="zk/shielded3/stark/target/$ARM_RUST_TARGET/release/libtkm_shield3_stark.a"
          test -s "$native_lib"
          VERSION="$RELEASE_TAG" RANDOMX_ARCH=default \
            make "$ARM_MAKE_CC=$ARM_CC" "$ARM_MAKE_CXX=$ARM_CXX" "$ARM_CROSS_TARGET"
          test -s "$native_lib"
          arm_gtkm="build/dist/linux/$ARM_OUTPUT_DIR/gtkm-linux-$ARM_BINARY_SUFFIX"
          stack_flags="$(readelf -W -l "$arm_gtkm" | awk '$1 == "GNU_STACK" { print $7; found=1 } END { if (!found) exit 1 }')"
          test "$stack_flags" = RW

          # The pool prover is a separate binary and must carry the same
          # architecture-specific Shield3 verifier as gtkm.
          mkdir -p "build/dist/linux/$ARM_OUTPUT_DIR"
          CGO_ENABLED=1 GOOS=linux GOARCH="$ARM_GOARCH" GOARM="${ARM_GOARM:-}" CC="$ARM_CC" CXX="$ARM_CXX" \
            go build -trimpath -ldflags="-s -w -X main.Version=$RELEASE_TAG" \
            -tags shield3 \
            -o "build/dist/linux/$ARM_OUTPUT_DIR/shielded-payout-prover-linux-$ARM_BINARY_SUFFIX" \
            ./cmd/shielded-payout-prover
          GOOS=linux GOARCH="$ARM_GOARCH" GOARM="${ARM_GOARM:-}" \
            go build -trimpath -ldflags="-s -w -X main.Version=$RELEASE_TAG" \
            -o "build/dist/linux/$ARM_OUTPUT_DIR/tkm-email-linux-$ARM_BINARY_SUFFIX" \
            ./cmd/tkm-email

          archive="gtkm-${RELEASE_TAG}-linux-${ARM_LABEL}"
          mkdir -p "release/$archive"
          cp "build/dist/linux/$ARM_OUTPUT_DIR/gtkm-linux-$ARM_BINARY_SUFFIX" "release/$archive/gtkm"
          cp "build/dist/linux/$ARM_OUTPUT_DIR/tkm-email-linux-$ARM_BINARY_SUFFIX" "release/$archive/tkm-email"
          cp "build/dist/linux/$ARM_OUTPUT_DIR/shielded-payout-prover-linux-$ARM_BINARY_SUFFIX" \
            "release/$archive/shielded-payout-prover"
          cp THIRD_PARTY_NOTICES "release/$archive/"

          # Build the native Debian package from the cross-compiled binaries.
          mkdir -p build/bin
          cp "release/$archive/gtkm" build/bin/gtkm
          cp "release/$archive/shielded-payout-prover" build/bin/shielded-payout-prover
          ./packaging/build-deb.sh "$RELEASE_TAG" release "$ARM_DEB_ARCH"
          tar -C release -czf "release/$archive.tar.gz" "$archive"

      - name: Upload Linux ${{ matrix.label }} archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.label }}
          path: |
            release/*.tar.gz
            release/*.deb
          if-no-files-found: error
          retention-days: 1

  build-windows-gui:
    needs: [resolve-source, shield6-validation]
    name: Build Windows GUI wallet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/gui/wallet-engine/package-lock.json
      - name: Install Shield3 Windows Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustup target add x86_64-pc-windows-gnu
      - name: Install Windows cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Build wallet assets and Windows executables
        run: |
          npm ci --prefix internal/gui/wallet-engine
          npm test --prefix internal/gui/wallet-engine
          npm run build --prefix internal/gui/wallet-engine
          python3 build/wallet-signing/windows-metadata.py --publisher TKMChain --version "${RELEASE_TAG#v}"
          make randomx-windows
          CC=x86_64-w64-mingw32-gcc-posix SHIELD4_RUST_TARGET=x86_64-pc-windows-gnu ./scripts/shield4-build.sh
          VERSION="$RELEASE_TAG" RANDOMX_ARCH=default make gtkm-gui-windows
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc-posix CGO_LDFLAGS='-static-libgcc -Wl,-Bstatic -lwinpthread -Wl,-Bdynamic' go build -tags shield3 -trimpath -ldflags='-s -w' -o build/bin/shielded-payout-prover.exe ./cmd/shielded-payout-prover
          archive="TKM-Wallet-${RELEASE_TAG}-windows-x64"
          mkdir -p "release/$archive/licenses"
          cp build/bin/gtkm-gui-windows-amd64.exe "release/$archive/TKM-Wallet.exe"
          cp build/bin/shielded-payout-prover.exe "release/$archive/"
          cp internal/gui/wallet-engine/licenses/* "release/$archive/licenses/"
          cp THIRD_PARTY_NOTICES "release/$archive/licenses/"
          cp internal/gui/README.md "release/$archive/README.md"
          printf '%s\n' 'Requires Microsoft Edge WebView2 Runtime. Windows executables have publisher metadata but are not Authenticode signed.' > "release/$archive/INSTALL.txt"
          for binary in "release/$archive/"*.exe; do
            if x86_64-w64-mingw32-objdump -p "$binary" | grep -Eiq 'DLL Name: (libstdc\+\+-6|libgcc_s_[^.]+-1|libwinpthread-1)\.dll'; then
              echo "Unexpected MinGW runtime dependency in $binary" >&2
              exit 1
            fi
          done
          (cd release && zip -r "$archive.zip" "$archive")
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-gui
          path: release/*.zip
          if-no-files-found: error
          retention-days: 1

  build-android:
    needs: [resolve-source, shield6-validation]
    name: Build signed Android wallet
    runs-on: ubuntu-latest
    # Use the pipe fallback so transient proxy/DNS failures fall back to the
    # module source instead of aborting the Android build immediately.
    env:
      GOPROXY: 'https://proxy.golang.org|direct'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.sha }}
      - name: Prepare Android release signing
        env:
          KEYSTORE_BASE64: ${{ !inputs.validation_only && secrets.TKM_ANDROID_KEYSTORE_BASE64 || '' }}
          KEY_ALIAS: ${{ !inputs.validation_only && secrets.TKM_ANDROID_KEY_ALIAS || '' }}
          KEYSTORE_PASSWORD: ${{ !inputs.validation_only && secrets.TKM_ANDROID_KEYSTORE_PASSWORD || '' }}
          VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/tkm-signing"
          mkdir -p "$signing_dir"
          if [[ "$VALIDATION_ONLY" == true ]]; then
            # Exercise release APK signing without using the production key.
            KEY_ALIAS=validation-only
            openssl rand -hex 24 > "$signing_dir/password"
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "$signing_dir/release.p12" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 2 \
              -dname 'CN=Validation Only, O=Do Not Distribute' \
              -storepass:file "$signing_dir/password" \
              -keypass:file "$signing_dir/password"
          elif [[ -z "$KEYSTORE_BASE64" || -z "$KEY_ALIAS" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo 'Configure TKM_ANDROID_KEYSTORE_BASE64, TKM_ANDROID_KEY_ALIAS and TKM_ANDROID_KEYSTORE_PASSWORD repository secrets before releasing.' >&2
            exit 1
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.p12"
            printf '%s' "$KEYSTORE_PASSWORD" > "$signing_dir/password"
          fi
          {
            echo "TKM_ANDROID_KEYSTORE=$signing_dir/release.p12"
            echo "TKM_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "TKM_ANDROID_STORE_PASSWORD_FILE=$signing_dir/password"
            echo "TKM_ANDROID_KEY_PASSWORD_FILE=$signing_dir/password"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Warm Go module cache with network retries
        shell: bash
        run: |
          set -euo pipefail
          go env GOPROXY
          for attempt in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            if [[ "$attempt" == 5 ]]; then
              echo 'Go module download failed after five attempts.' >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "Go module download failed; retrying in ${delay}s (attempt $((attempt + 1))/5)..." >&2
            sleep "$delay"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/gui/wallet-engine/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the removed `tools` package on some runners.
          # Install the supported platform-tools package instead; build-specific
          # platforms, build-tools, and NDK are installed in the next step.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Shield3 Android Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustup target add aarch64-linux-android
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018'
      - name: Build and verify signed APK
        env:
          TKM_ANDROID_BUILD_VARIANT: release
          TKM_PUBLISHER: TKMChain
        run: |
          npm ci --prefix internal/gui/wallet-engine
          npm run build --prefix internal/gui/wallet-engine
          make randomx-host
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export GRADLE_BIN="$(command -v gradle)"
          export TKM_ANDROID_VERSION_NAME="${RELEASE_TAG#v}"
          if [[ ! "$TKM_ANDROID_VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo 'Android releases require a vMAJOR.MINOR.PATCH tag' >&2
            exit 1
          fi
          export TKM_ANDROID_VERSION_CODE="$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))"
          ./android/build.sh
          mkdir -p release
          apk="release/TKM-Wallet-${RELEASE_TAG}-android-arm64.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          cp android/email/build/outputs/apk/release/email-release.apk "release/TKM-Email-${RELEASE_TAG}-android-arm64.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/tkm-signing"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*.apk
          if-no-files-found: error
          retention-days: 1

  build-browser-shield3:
    needs: [resolve-source, shield6-validation]
    name: Build browser-native Shield3 prover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Install Rust WASM target
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustup target add wasm32-unknown-unknown
      - name: Build browser Shield3 modules
        run: |
          ./scripts/shield3-browser-build.sh "release/tkm-shield3-browser-${RELEASE_TAG}"
          tar -C "release" -czf "release/tkm-shield3-browser-${RELEASE_TAG}.tar.gz" "tkm-shield3-browser-${RELEASE_TAG}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-browser-shield3
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  shield6-parameters:
    name: Package authenticated Shield6 production parameters
    needs: [resolve-source, shield6-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Download and verify pinned public artifacts
        run: python3 scripts/shield6-release-parameters.py --output shield6-parameters
      - name: Package parameters and provenance
        run: |
          cp params/shield6_production.json shield6-parameters/release-metadata.json
          tar -czf "Shield6-parameters-v2-${RELEASE_TAG}.tar.gz" shield6-parameters
      - uses: actions/upload-artifact@v4
        with:
          name: release-shield6-parameters
          path: Shield6-parameters-v2-*.tar.gz
          if-no-files-found: error

  release:
    name: Validate release assets and optionally publish
    permissions:
      contents: write
    needs:
      - resolve-source
      - build
      - build-debian13
      - build-linux-arm
      - build-windows-gui
      - build-android
      - build-browser-shield3
      - shield6-parameters
    runs-on: ubuntu-latest

    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Record source provenance
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
          VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > release-assets/SOURCE_COMMIT
          printf '%s\n' "$VALIDATION_ONLY" > release-assets/VALIDATION_ONLY

      - name: List downloaded assets
        run: |
          ls -la release-assets/
          echo "Found $(find release-assets -type f | wc -l) files"

      - name: Generate release checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz *.zip *.apk *.deb SOURCE_COMMIT VALIDATION_ONLY > SHA256SUMS

      - name: Upload validated release assets and checksums
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub release
        if: github.event_name == 'push' || !inputs.validation_only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.apk
            release-assets/*.deb
            release-assets/SHA256SUMS
            release-assets/SOURCE_COMMIT
            release-assets/VALIDATION_ONLY
