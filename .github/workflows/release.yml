name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  build:
    name: Build ${{ matrix.platform }} binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            artifact: release-linux
          - runner: macos-latest
            platform: macos
            artifact: release-macos
          - runner: windows-latest
            platform: windows
            artifact: release-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Set up Windows build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            cmake
            zip
            mingw-w64-ucrt-x86_64-toolchain

      - name: Find Go for MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $goBin = Split-Path -Parent (Get-Command go).Source
          "GO_BIN=$goBin" >> $env:GITHUB_ENV

      - name: Build and package Linux or macOS binaries
        if: runner.os != 'Windows'
        run: |
          make gtkm shielded-payout-prover
          archive="gtkm-${RELEASE_TAG}-${{ matrix.platform }}"
          mkdir -p "release/$archive"
          cp build/bin/gtkm build/bin/shielded-payout-prover "release/$archive/"
          tar -C release -czf "release/$archive.tar.gz" "$archive"

      - name: Build and package Windows binaries
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath -u "$GO_BIN"):$PATH"
          go version
          make gtkm shielded-payout-prover
          archive="gtkm-${RELEASE_TAG}-windows"
          mkdir -p "release/$archive"
          cp build/bin/gtkm build/bin/shielded-payout-prover "release/$archive/"
          (cd release && zip -r "$archive.zip" "$archive")

      - name: Upload platform archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error
          retention-days: 1

build-debian13:
  name: Build Debian 13 binaries
  runs-on: ubuntu-latest
  container:
    image: debian:13-slim

  steps:
    - name: Install Debian 13 build tools
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential \
          ca-certificates \
          cmake \
          git \
          gzip \
          pkg-config \
          tar
        rm -rf /var/lib/apt/lists/*

    - name: Check out source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ env.RELEASE_TAG }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.5'
        check-latest: true

    # Add this step to fix Git configuration
    - name: Configure Git for Debian container
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory /__w/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)
        # Also set Git user info to avoid any potential issues
        git config --global user.email "ci@debian.local"
        git config --global user.name "CI Build"
        # Show Git configuration for debugging
        git config --list

    - name: Verify Debian and Go versions
      run: |
        cat /etc/os-release
        git --version
        go version

    - name: Build and package Debian 13 binaries
      run: |
        # Set GOFLAGS to disable VCS stamping
        export GOFLAGS="-buildvcs=false"
        # Also set GIT_CONFIG to ensure Git picks up the config
        export GIT_CONFIG_GLOBAL=/root/.gitconfig
        make gtkm shielded-payout-prover
        archive="gtkm-${RELEASE_TAG}-debian13-amd64"
        mkdir -p "release/$archive"
        cp build/bin/gtkm build/bin/shielded-payout-prover "release/$archive/"
        tar -C release -czf "release/$archive.tar.gz" "$archive"

    - name: Upload Debian 13 archive
      uses: actions/upload-artifact@v4
      with:
        name: release-debian13
        path: release/*.tar.gz
        if-no-files-found: error
        retention-days: 1

  release:
    name: Publish GitHub release
    needs:
      - build
      - build-debian13
    runs-on: ubuntu-latest

    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
