name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            artifact: gtkm-linux
          - runner: macos-latest
            platform: macos
            artifact: gtkm-macos
          - runner: windows-latest
            platform: windows
            artifact: gtkm-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Set up Windows build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            cmake
            mingw-w64-ucrt-x86_64-toolchain

      - name: Find Go for MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $goBin = Split-Path -Parent (Get-Command go).Source
          "GO_BIN=$goBin" >> $env:GITHUB_ENV

      - name: Build gtkm and shielded payout prover
        if: runner.os != 'Windows'
        run: make gtkm shielded-payout-prover

      - name: Build gtkm and shielded payout prover
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath -u "$GO_BIN"):$PATH"
          go version
          make gtkm shielded-payout-prover

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/gtkm*
            build/bin/shielded-payout-prover*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
