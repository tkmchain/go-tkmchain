name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
  GOFLAGS: "-buildvcs=false"

jobs:
  build:
    name: Build ${{ matrix.platform }} binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            artifact: release-linux
          - runner: macos-latest
            platform: macos
            artifact: release-macos
          - runner: windows-latest
            platform: windows
            artifact: release-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Set up Windows build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            cmake
            zip
            mingw-w64-ucrt-x86_64-toolchain

      - name: Find Go for MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $goBin = Split-Path -Parent (Get-Command go).Source
          "GO_BIN=$goBin" >> $env:GITHUB_ENV

      - name: Build and package Linux or macOS binaries
        if: runner.os != 'Windows'
        run: |
          make gtkm shielded-payout-prover
          archive="gtkm-${RELEASE_TAG}-${{ matrix.platform }}"
          mkdir -p "release/$archive"
          cp build/bin/gtkm build/bin/shielded-payout-prover "release/$archive/"
          tar -C release -czf "release/$archive.tar.gz" "$archive"

      - name: Build and package Windows binaries
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath -u "$GO_BIN"):$PATH"
          go version

          # RandomX is C++, so the ordinary host link flags would leave gtkm.exe
          # dependent on MSYS2's libstdc++-6.dll (and usually libwinpthread).
          # Link those MinGW runtimes statically so the release is portable to a
          # clean Windows installation.
          windows_randomx_ldflags="-Lbuild/_workspace/randomx/build-host -lrandomx -static-libgcc -static-libstdc++ -Wl,-Bstatic -lstdc++ -lwinpthread -Wl,-Bdynamic -lm"
          make HOST_RANDOMX_LDFLAGS="$windows_randomx_ldflags" gtkm
          make shielded-payout-prover

          archive="gtkm-${RELEASE_TAG}-windows"
          mkdir -p "release/$archive"
          cp build/bin/gtkm "release/$archive/gtkm.exe"
          cp build/bin/shielded-payout-prover "release/$archive/shielded-payout-prover.exe"

          # Do not publish executables that only work inside the MSYS2 runner.
          for binary in "release/$archive/gtkm.exe" "release/$archive/shielded-payout-prover.exe"; do
            runtime_dlls="$(objdump -p "$binary" | sed -n 's/^[[:space:]]*DLL Name: //p')"
            echo "Imported DLLs for $binary:"
            printf '%s\n' "$runtime_dlls"
            if printf '%s\n' "$runtime_dlls" | grep -Eiq '^(libstdc\+\+-6|libgcc_s_[^.]+-1|libwinpthread-1)\.dll$'; then
              echo "ERROR: $binary still depends on a MinGW runtime DLL" >&2
              exit 1
            fi
          done

          (cd release && zip -r "$archive.zip" "$archive")

      - name: Upload platform archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error
          retention-days: 1

  build-debian13:
    name: Build Debian 13 binaries
    runs-on: ubuntu-latest
    container:
      image: debian:13-slim

    steps:
      - name: Install Debian 13 build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            gzip \
            pkg-config \
            tar \
            zip
          rm -rf /var/lib/apt/lists/*

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory /__w/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Verify environment
        run: |
          cat /etc/os-release
          git --version
          go version
          go env

      - name: Build and package Debian 13 binaries
        run: |
          make gtkm shielded-payout-prover
          archive="gtkm-${RELEASE_TAG}-debian13-amd64"
          mkdir -p "release/$archive"
          cp build/bin/gtkm build/bin/shielded-payout-prover "release/$archive/"
          tar -C release -czf "release/$archive.tar.gz" "$archive"

      - name: Upload Debian 13 archive
        uses: actions/upload-artifact@v4
        with:
          name: release-debian13
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs:
      - build
      - build-debian13
    runs-on: ubuntu-latest

    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded assets
        run: |
          ls -la release-assets/
          echo "Found $(find release-assets -type f | wc -l) files"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
