name: Shield3/Shield6 cryptography

on:
  pull_request:
    paths:
      - 'crypto/pqcrypto/**'
      - 'zk/shielded3/**'
      - 'zk/shielded6/**'
      - 'core/**'
      - 'accounts/keystore/**'
      - 'eth/**'
      - 'node/**'
      - 'miner/**'
      - 'internal/ethapi/**'
      - 'cmd/shielded-payout-prover/**'
      - 'Makefile'
      - 'android/build.sh'
      - '.github/workflows/release.yml'
      - 'internal/shield3wallet/**'
      - 'internal/shield3relay/**'
      - 'cmd/shield3-relay/**'
      - 'internal/gui/**'
      - 'scripts/shield3-build.sh'
      - 'scripts/shield4-build.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/shield3-crypto.yml'
  push:
    paths:
      - 'crypto/pqcrypto/**'
      - 'zk/shielded3/**'
      - 'zk/shielded6/**'
      - 'core/**'
      - 'accounts/keystore/**'
      - 'eth/**'
      - 'node/**'
      - 'miner/**'
      - 'internal/ethapi/**'
      - 'cmd/shielded-payout-prover/**'
      - 'Makefile'
      - 'android/build.sh'
      - '.github/workflows/release.yml'
      - 'internal/shield3wallet/**'
      - 'internal/shield3relay/**'
      - 'cmd/shield3-relay/**'
      - 'internal/gui/**'
      - 'scripts/shield3-build.sh'
      - 'scripts/shield4-build.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/shield3-crypto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TKM_SHIELD3_TESTDATA: ${{ github.workspace }}/.tmp/shield3-vectors
      TKM_SHIELD4_TESTDATA: ${{ github.workspace }}/.tmp/shield4-vectors
      TKM_SHIELD3_RELAY_TESTDATA: ${{ github.workspace }}/.tmp/shield3-relay-vectors
      TKM_SHIELD3_STARK_BIN: ${{ github.workspace }}/zk/shielded3/stark/target/release/tkm-shield3-stark
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      # Use the public module mirror first, then fall back to the source on
      # transient proxy or DNS failures. The retry step below makes the
      # dependency download (including golang.org/x/text) deterministic.
      GOPROXY: 'https://proxy.golang.org|direct'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test directories
        run: mkdir -p "$TKM_SHIELD3_TESTDATA" "$TKM_SHIELD4_TESTDATA" "$TKM_SHIELD3_RELAY_TESTDATA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Warm Go module cache with retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            if [[ "$attempt" == 5 ]]; then
              echo 'Go module download failed after five attempts.' >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "Go module download failed; retrying in ${delay}s (attempt $((attempt + 1))/5)..." >&2
            sleep "$delay"
          done
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting and lint
        run: |
          cargo +1.89.0 fmt --manifest-path zk/shielded3/stark/Cargo.toml -- --check
          cargo +1.89.0 clippy --release --locked --manifest-path zk/shielded3/stark/Cargo.toml --all-targets -- -D warnings
      - name: Generate and verify real STARK proofs
        run: cargo +1.89.0 test --release --locked --manifest-path zk/shielded3/stark/Cargo.toml -- --test-threads=1
      - name: Build and validate native Shield4 verifier
        run: ./scripts/shield4-build.sh
      - name: Race-test PQ, Shield3, and Shield4 crypto
        run: go test -race -timeout 45m -tags shield3 ./crypto/pqcrypto ./zk/shielded3 ./zk/shielded4
      - name: Isolate Shield3 wallet consensus race test
        shell: bash
        run: |
          set +e
          go test -race -timeout 15m -tags shield3 ./internal/shield3wallet -run '^TestShield3WalletConsensus$' -count=1 >"$RUNNER_TEMP/shield6-wallet-consensus-race.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/shield6-wallet-consensus-race.log"
          if [[ "$status" -ne 0 ]]; then
            # Surface only actionable test/race summaries in the public check
            # annotations. Full logs remain available to repository admins.
            grep -E '^--- FAIL:|^FAIL |^panic:|^signal:|^[[:space:]]+.*_test\.go:[0-9]+:|WARNING: DATA RACE' "$RUNNER_TEMP/shield6-wallet-consensus-race.log" | grep -v 'processed canonical transaction' | while IFS= read -r line; do
              echo "::error title=Shield3 wallet consensus race test::${line}"
            done
          fi
          exit "$status"
      - name: Race-test remaining wallet builders and scanners
        shell: bash
        run: |
          set +e
          go test -race -timeout 45m -tags shield3 -skip '^TestShield3WalletConsensus$' ./internal/shield3wallet >"$RUNNER_TEMP/shield6-wallet-race.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/shield6-wallet-race.log"
          if [[ "$status" -ne 0 ]]; then
            grep -E '^--- FAIL:|^FAIL |^panic:|^signal:|^[[:space:]]+.*_test\.go:[0-9]+:|WARNING: DATA RACE' "$RUNNER_TEMP/shield6-wallet-race.log" | grep -v 'processed canonical transaction' | while IFS= read -r line; do
              echo "::error title=Shield3 wallet race test::${line}"
            done
          fi
          exit "$status"
      - name: Race-test keystore and desktop wallet
        run: go test -race -timeout 45m -tags shield3 ./accounts/keystore ./internal/gui
      # This rehearsal uses the rebuilt native archive and covers wallet
      # construction, multi-input spends, relay replay protection,
      # withdrawal replay protection, and a reorged scan head.
      - name: Rehearse Shield4 multi-node wallet, replay, and reorg flows
        run: go test -timeout 45m -tags shield3 ./internal/shield3wallet -run '^TestShield4MultiNodeRehearsal$'
      - name: Test existing shielded consensus and RPC regressions
        run: go test -tags shield3 ./core ./eth ./internal/ethapi ./cmd/shielded-payout-prover -run 'Shielded|Shield3|Stamped'
      # Shield6 is intentionally inactive by default. Exercise its CLSAG,
      # RingCT, accumulator, fork-gate, RPC and wallet construction paths
      # against the production stamp backend without setting activation.
      - name: Test Shield6 crypto, consensus, and RPC paths
        run: go test -tags shield3 ./zk/shielded6 ./core ./eth -run 'ShieldedV6|Shield6'
      - name: Rehearse Shield6 canonical deposit, spend, replay, and reorg
        run: GOMAXPROCS=1 GOMEMLIMIT=1300MiB GOGC=20 go test -p=1 -timeout 10m -tags shield3 ./core -run '^TestShield6TwoNodeDepositSpendReplayAndReorgRehearsal$' -count=1 -v
      - name: Test Shield6 wallet deposit and payment signing
        run: go test -tags shield3 ./internal/shield3wallet -run '^TestBuildAndSignShieldedV6(Deposit|Payment)$'
      - name: Test migration confirmation handling
        run: go test -tags shield3 ./cmd/gtkm -run '^TestWaitWalletCanonicalConfirmations$'
      - name: Benchmark maximum Shield6 proof verification
        run: go test -tags shield3 ./zk/shielded6 -run '^$' -bench 'BenchmarkShield6' -benchmem -count=1
      - name: Benchmark maximum Shield6 payment construction
        run: go test -tags shield3 ./core -run '^$' -bench '^BenchmarkShield6MaxPaymentEnvelope$' -benchmem -count=3
      - name: Race-test relay replay protection
        run: go test -race -tags shield3 ./internal/shield3relay ./cmd/shield3-relay
      - name: Vet privacy, wallet, relay, and CLI packages
        run: go vet -tags shield3 ./crypto/pqcrypto ./zk/shielded3 ./zk/shielded6 ./internal/shield3wallet ./accounts/keystore ./internal/gui ./internal/shield3relay ./cmd/shield3-relay ./cmd/gtkm

      - name: Build production Linux GTKM daemon
        env:
          GO_BUILD_P: '2'
          RANDOMX_ARCH: default
        run: |
          make production-gtkm
          file build/bin/gtkm
          ./build/bin/gtkm version

  shield6-migration:
    name: Shield6 native migration rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      GOPROXY: 'https://proxy.golang.org|direct'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Build and validate native Shield4 verifier
        run: ./scripts/shield4-build.sh
      - name: Run real Shield4-to-Shield6 migration on two state replicas
        run: GOMAXPROCS=1 GOMEMLIMIT=1300MiB GOGC=20 go test -p=1 -timeout 45m -tags shield3 ./internal/shield3wallet -run '^TestShield6MigrationNativeRehearsal$' -count=1 -v
      - name: Verify Shield6 remains inactive on shipped networks
        run: go test -p=1 ./params -run '^TestShield6ActivationRemainsUnsetOnShippedNetworks$' -count=1

  shield6-linux-armv7:
    name: Shield6 Linux ARMv7 production cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      GOPROXY: 'https://proxy.golang.org|direct'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux ARMv7 cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-linux-gnueabihf \
            cmake \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf
      - name: Install pinned Rust ARMv7 target
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustup target add armv7-unknown-linux-gnueabihf
      - name: Build and validate ARMv7 RandomX and Shield4 archives
        run: |
          make randomx-linux-arm
          CC=arm-linux-gnueabihf-gcc \
            SHIELD4_RUST_TARGET=armv7-unknown-linux-gnueabihf \
            ./scripts/shield4-build.sh
      - name: Cross-compile Shield6 crypto tests
        run: |
          GOOS=linux GOARCH=arm GOARM=7 \
            go test -tags shield3 -c -o /tmp/shield6-armv7.test ./zk/shielded6
      - name: Build production ARMv7 GTKM daemon
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7 \
            CC=arm-linux-gnueabihf-gcc CXX=arm-linux-gnueabihf-g++ \
            CGO_CFLAGS='-Ibuild/_workspace/randomx/src' \
            CGO_LDFLAGS='-Lbuild/_workspace/randomx/build-linux-arm -lrandomx -lstdc++ -lm -Wl,-z,noexecstack' \
            go build -p=1 -trimpath -tags 'randomx,cgo,shield3' \
              -ldflags='-s -w' -o /tmp/gtkm-shield6-linux-armv7 ./cmd/gtkm
          file /tmp/gtkm-shield6-linux-armv7
          stack_flags="$(readelf -W -l /tmp/gtkm-shield6-linux-armv7 | awk '$1 == "GNU_STACK" { print $7; found=1 } END { if (!found) exit 1 }')"
          test "$stack_flags" = RW

  shield6-macos-arm64:
    name: Shield6 macOS Apple Silicon production build
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      GOPROXY: 'https://proxy.golang.org|direct'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Build and validate native Shield4 verifier
        run: ./scripts/shield4-build.sh
      - name: Cross-check Shield6 crypto and activation gate
        run: |
          go test -tags shield3 ./zk/shielded6 -count=1
          go test ./params -run '^TestShield6ActivationRemainsUnsetOnShippedNetworks$' -count=1
      - name: Build production Apple Silicon GTKM daemon
        env:
          RANDOMX_ARCH: default
          VERSION: 1.21.82-shielded-gas
        run: |
          make gtkm
          file build/bin/gtkm
          ./build/bin/gtkm version
