name: Keeper proof artifact

on:
  workflow_dispatch:
    inputs:
      payload_path:
        description: Repository-relative complete Payload RLP for block 44423
        required: false
        default: 2_payload.rlp
        type: string
      payload_url:
        description: Optional HTTPS URL for the RLP payload; takes precedence over payload_path
        required: false
        default: ''
        type: string
      chain_id:
        description: TKM chain ID (8979 mainnet or 8980 Egypt)
        required: false
        default: '8979'
        type: string
      block_number:
        description: Expected block height in the payload
        required: false
        default: '44423'
        type: string

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GOMAXPROCS: '2'
      TKM_KEEPER_BUILD_PARALLELISM: '2'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-08-17

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zk/zkevm/keeper-host/target
          key: keeper-${{ runner.os }}-${{ hashFiles('zk/zkevm/keeper-host/Cargo.toml', 'zk/zkevm/keeper-host/Cargo.lock') }}
          restore-keys: |
            keeper-${{ runner.os }}-

      - name: Install keeper build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang libclang-dev llvm protobuf-compiler python3
          command -v protoc
          protoc --version
          echo 'PROTOC=/usr/bin/protoc' >> "$GITHUB_ENV"

      - name: Configure bindgen and payload
        env:
          PAYLOAD_PATH: ${{ inputs.payload_path }}
          PAYLOAD_URL: ${{ inputs.payload_url }}
          EXPECTED_CHAIN_ID: ${{ inputs.chain_id }}
          EXPECTED_BLOCK_NUMBER: ${{ inputs.block_number }}
        run: |
          gcc_include="$(gcc -print-file-name=include)"
          test -d "$gcc_include"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I${gcc_include}" >> "$GITHUB_ENV"
          mkdir -p build
          if [[ -n "$PAYLOAD_URL" ]]; then
            case "$PAYLOAD_URL" in
              https://*) ;;
              *) echo "payload_url must use HTTPS" >&2; exit 2 ;;
            esac
            curl --fail --location --retry 5 --retry-all-errors "$PAYLOAD_URL" -o build/keeper-input.rlp
          elif [[ -n "$PAYLOAD_PATH" ]]; then
            test -f "$PAYLOAD_PATH"
            cp "$PAYLOAD_PATH" build/keeper-input.rlp
          else
            echo "payload_path or payload_url is required for block ${EXPECTED_BLOCK_NUMBER}" >&2
            exit 2
          fi
          test -s build/keeper-input.rlp
          go run ./cmd/keeperpayload \
            --input build/keeper-input.rlp \
            --expect-chain-id "$EXPECTED_CHAIN_ID" \
            --expect-block "$EXPECTED_BLOCK_NUMBER"

      - name: Build keeper guest ELF
        run: |
          (while sleep 30; do echo "keeper guest build still running"; done) &
          heartbeat=$!
          trap 'kill "$heartbeat" 2>/dev/null || true' EXIT
          zk/zkevm/build_keeper.sh build/keeper-mipsle

      - name: Fetch locked Rust dependencies
        run: cargo +nightly-2025-08-17 fetch --locked --manifest-path zk/zkevm/keeper-host/Cargo.toml

      - name: Generate compressed proof and verifying key
        run: |
          rm -f keeper-proof.bin keeper-vk.bin
          BINDGEN_EXTRA_CLANG_ARGS="$BINDGEN_EXTRA_CLANG_ARGS" \
            cargo +nightly-2025-08-17 run --release --offline --locked \
              --manifest-path zk/zkevm/keeper-host/Cargo.toml -- \
              --elf "$PWD/build/keeper-mipsle" \
              --input "$PWD/build/keeper-input.rlp" \
              --proof "$PWD/keeper-proof.bin" \
              --vk "$PWD/keeper-vk.bin"

      - name: Verify generated proof artifact
        run: |
          BINDGEN_EXTRA_CLANG_ARGS="$BINDGEN_EXTRA_CLANG_ARGS" \
            cargo +nightly-2025-08-17 run --release --offline --locked \
              --manifest-path zk/zkevm/keeper-host/Cargo.toml -- \
              --verify "$PWD/keeper-proof.bin" \
              --vk "$PWD/keeper-vk.bin"

      - name: Write artifact metadata and checksums
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "rust=nightly-2025-08-17"
            echo "payload=build/keeper-input.rlp"
          } > keeper-proof.metadata
          sha256sum build/keeper-mipsle build/keeper-input.rlp keeper-proof.bin keeper-vk.bin > keeper-proof.sha256

      - name: Upload keeper proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: keeper-proof-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/keeper-mipsle
            build/keeper-input.rlp
            keeper-proof.bin
            keeper-vk.bin
            keeper-proof.metadata
            keeper-proof.sha256
