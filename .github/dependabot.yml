version: 2

updates:
  # The keeper is built from the root module so its dependencies are covered
  # by the root scan and cannot drift into a separate self-dependency graph.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    versioning-strategy: increase
  - package-ecosystem: npm
    directory: "/internal/gui/wallet-engine"
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: "/zk/shielded3/stark"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: "/zk/zkevm/keeper-host"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
