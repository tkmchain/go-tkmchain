version: 2

updates:
  # Keep both Go modules current. The keeper is released as a separate
  # executable but shares the root module through a local replace directive.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    versioning-strategy: increase
  - package-ecosystem: gomod
    directory: "/cmd/keeper"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    versioning-strategy: increase

  - package-ecosystem: npm
    directory: "/internal/gui/wallet-engine"
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: "/zk/shielded3/stark"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: "/zk/zkevm/keeper-host"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
