plugins {
    id 'com.android.application'
}

def signingEnvironment = [
    store: System.getenv('TKM_ANDROID_KEYSTORE'),
    alias: System.getenv('TKM_ANDROID_KEY_ALIAS'),
    storePasswordFile: System.getenv('TKM_ANDROID_STORE_PASSWORD_FILE'),
    keyPasswordFile: System.getenv('TKM_ANDROID_KEY_PASSWORD_FILE')
]
def releaseSigningReady = signingEnvironment.values().every { it != null && !it.trim().isEmpty() }
def readSigningPassword = { path ->
    def passwordFile = new File(path)
    if (!passwordFile.isFile()) throw new GradleException('Signing password file is missing')
    return passwordFile.getText('UTF-8').replaceFirst(/[\r\n]+$/, '')
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !releaseSigningReady) {
        throw new GradleException('Release signing is not configured. Set TKM_ANDROID_KEYSTORE, TKM_ANDROID_KEY_ALIAS, TKM_ANDROID_STORE_PASSWORD_FILE and TKM_ANDROID_KEY_PASSWORD_FILE. No unsigned release will be produced.')
    }
}

android {
    namespace 'com.tkmchain.node'
    compileSdk 34

    defaultConfig {
        applicationId "com.tkmchain.node"
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('TKM_ANDROID_VERSION_CODE') ?: '5')
        versionName System.getenv('TKM_ANDROID_VERSION_NAME') ?: "0.5.0"
        resValue "string", "publisher_name", System.getenv('TKM_PUBLISHER') ?: "TKMChain"
    }

    // Gtkm and the prover are executable payloads. Package them as native
    // libraries so Android extracts them into nativeLibraryDir, which is an
    // executable mount on devices that disallow exec from filesDir.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    packaging { jniLibs { useLegacyPackaging = true } }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(signingEnvironment.store)
                keyAlias signingEnvironment.alias
                storePassword readSigningPassword(signingEnvironment.storePasswordFile)
                keyPassword readSigningPassword(signingEnvironment.keyPasswordFile)
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
